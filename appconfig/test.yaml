---
environment: production
environmentCode: test
container:
  sftpDebug: true
  azureStorageAccountName: testffcpayst1001
  sftpManagedGatewayPort: 22
  sftpTraderPort: 22
  sfiInboundDirectory: mgspymtsvc/mgs031/outbound
  sfiPilotInboundDirectory: mgspymtsvc/mgs031/outbound
  lumpSumsInboundDirectory: mgspymtsvc/mgs031/outbound
  csInboundDirectory: mgspymtsvc/mgs025/outbound
  bpsInboundDirectory: mgspymtsvc/mgs018/outbound
  esInboundDirectory: mgspymtsvc/mgs033/outbound
  esOutboundDirectory: mgspymtsvc/mgs034/inbound
  fcInboundDirectory: mgspymtsvc/mgs008/outbound
  fcOutboundDirectory: mgspymtsvc/mgs006/inbound
  impsInboundDirectory: D:\app\DAX_interface\CFI\outbound
  impsOutboundDirectory: D:\app\DAX_interface\CFI\inbound
  sfi23InboundDirectory: mgspymtsvc/mgs031/outbound
  dpsInboundDirectory: D:\app\DAX_interface\DPS\outbound
  dpsOutboundDirectory: D:\app\DAX_interface\DPS\inbound
  delinkedInboundDirectory: mgspymtsvc/mgs031/outbound
  combinedOfferInboundDirectory: mgspymtsvc/mgs031/outbound
  cohtCapitalInboundDirectory: mgspymtsvc/mgs031/outbound
  impsPollWindowStart: "00:00"
  impsPollWindowEnd: "23:59"
  impsPollDays: "Sun,Mon,Tue,Wed,Thu,Fri,Sat"
  dpsPollWindowStart: "00:00"
  dpsPollWindowEnd: "23:59"
  dpsPollDays: "Sun,Mon,Tue,Wed,Thu,Fri,Sat"

secretProviderClass:
  azure:
    keyvaultName: DEVFFCINFKV1001
    objects: # reading the secret from Azure Key Vault
      - objectName: devtest-ffcahwr-appInsights-connectionString
        objectType: secret
      - objectName: ffc-pay-callisto-password
        objectType: secret
      - objectName: ffc-pay-managed-gateway-key
        objectType: secret

  secretObjects: # creating a kubernetes secret from the Azure Key Vault secrets
    - secretName: ffc-pay-gateway
      type: Opaque
      data:
        - objectName: devtest-ffcahwr-appInsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING
        - objectName: ffc-pay-callisto-password
          key: SFTP_TRADER_PASSWORD
        - objectName: ffc-pay-managed-gateway-key
          key: SFTP_MANAGED_GATEWAY_PRIVATE_KEY